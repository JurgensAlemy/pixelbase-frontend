<aside class="sidebar">
  <div class="sidebar-logo">
    <img src="/img/logo-pixelBase.png" alt="PixelBase Logo" />
  </div>

  <nav class="sidebar-menu">
    <span class="menu-section">MENU PRINCIPAL</span>

    <a
      routerLink="/dashboard"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      class="menu-item"
    >
      <i class="fa-solid fa-chart-pie"></i> Dashboard
    </a>

    <a routerLink="/productos" routerLinkActive="active" class="menu-item">
      <i class="fa-solid fa-box-open"></i> Productos
    </a>

    <a routerLink="/pedidos" routerLinkActive="active" class="menu-item">
      <i class="fa-solid fa-cart-shopping"></i> Pedidos
      <span class="badge-count">12</span>
    </a>

    <a routerLink="/clientes" routerLinkActive="active" class="menu-item">
      <i class="fa-solid fa-users"></i> Clientes
    </a>

    <a routerLink="/reportes" routerLinkActive="active" class="menu-item">
      <i class="fa-solid fa-chart-line"></i> Reportes
    </a>

    <span class="menu-section menu-section--gap">CONFIGURACIÓN</span>

    <a routerLink="/ajustes" routerLinkActive="active" class="menu-item">
      <i class="fa-solid fa-gear"></i> Ajustes
    </a>

    <a routerLink="/roles" routerLinkActive="active" class="menu-item">
      <i class="fa-solid fa-shield-halved"></i> Roles y Permisos
    </a>
  </nav>

  <div class="sidebar-footer">
    <div class="admin-profile">
      <div class="admin-avatar">{{ userInitials() }}</div>
      <div class="admin-info">
        @if (auth.currentUser(); as user) {
          <span>{{ user.email }}</span>
          <small>{{ user.role }}</small>
        } @else {
          <span>Admin Principal</span>
          <small>admin&#64;pixelbase.io</small>
        }
      </div>
      <button
        type="button"
        class="logout-btn"
        (click)="logout()"
        title="Cerrar sesión"
        aria-label="Cerrar sesión"
      >
        <i class="fa-solid fa-right-from-bracket"></i>
      </button>
    </div>
  </div>
</aside>
